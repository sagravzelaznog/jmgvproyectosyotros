<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        .score-container {
            display: flex;
            justify-content: space-around;
            width: 800px;
            margin-bottom: 10px;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .score {
            text-align: center;
        }

        canvas {
            border: 3px solid white;
            background-color: black;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .instructions {
            color: #ccc;
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .instructions p {
            margin: 5px 0;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #00ff00;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
        }

        .game-over h2 {
            color: #00ff00;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
        }

        .game-over p {
            color: white;
            font-size: 24px;
            margin: 15px 0;
        }

        .game-over button {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 18px;
            background-color: #00ff00;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .game-over button:hover {
            background-color: #00cc00;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>PONG</h1>
    <div class="score-container">
        <div class="score">Player <span id="playerScore">0</span></div>
        <div class="score">Computer <span id="computerScore">0</span></div>
    </div>
    <canvas id="pongCanvas" width="800" height="400"></canvas>
    <div class="instructions">
        <p>Controls: Use <strong>Arrow Up/Down</strong> or <strong>Mouse Movement</strong> to move your paddle</p>
        <p>First to 5 points wins!</p>
    </div>

    <div class="game-over" id="gameOverScreen">
        <h2 id="winnerText">¡GANASTE!</h2>
        <p id="finalScoreText">Player: 5 - Computer: 3</p>
        <button onclick="restartGame()">Jugar de Nuevo</button>
    </div>

    <script>
        const canvas = document.getElementById('pongCanvas');
        const context = canvas.getContext('2d');
        const playerScoreDisplay = document.getElementById('playerScore');
        const computerScoreDisplay = document.getElementById('computerScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const winnerText = document.getElementById('winnerText');
        const finalScoreText = document.getElementById('finalScoreText');

        // Game variables
        const paddleWidth = 10;
        const paddleHeight = 100;
        const ballSize = 8;
        const WINNING_SCORE = 5;
        let gameActive = true;

        // Player paddle (left side)
        const player = {
            x: 20,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            score: 0,
            dy: 0,
            speed: 8
        };

        // Computer paddle (right side)
        const computer = {
            x: canvas.width - paddleWidth - 20,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            score: 0,
            dy: 0,
            speed: 5.5
        };

        // Ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            dx: 5,
            dy: 5,
            size: ballSize,
            speed: 5,
            maxSpeed: 10,
            lastPaddleHit: null
        };

        // Mouse position for paddle control
        let mouseY = canvas.height / 2;

        // Keyboard input
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Mouse movement for paddle control
        document.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseY = e.clientY - rect.top;
        });

        // Draw functions
        function drawPaddle(paddle) {
            context.fillStyle = '#00ff00';
            context.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
        }

        function drawBall() {
            context.fillStyle = '#ff00ff';
            context.beginPath();
            context.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
            context.fill();
        }

        function drawCenterLine() {
            context.strokeStyle = '#888888';
            context.setLineDash([5, 15]);
            context.lineWidth = 2;
            context.beginPath();
            context.moveTo(canvas.width / 2, 0);
            context.lineTo(canvas.width / 2, canvas.height);
            context.stroke();
            context.setLineDash([]);
        }

        // Check for winner
        function checkWinner() {
            if (player.score >= WINNING_SCORE) {
                endGame('¡GANASTE!', player.score, computer.score);
                return true;
            }
            if (computer.score >= WINNING_SCORE) {
                endGame('¡GAME OVER!', player.score, computer.score);
                return true;
            }
            return false;
        }

        // End game
        function endGame(message, playerFinalScore, computerFinalScore) {
            gameActive = false;
            winnerText.textContent = message;
            finalScoreText.textContent = `Player: ${playerFinalScore} - Computer: ${computerFinalScore}`;
            gameOverScreen.style.display = 'block';
        }

        // Update game state
        function update() {
            if (!gameActive) return; // No actualizar si el juego terminó

            // Player paddle control - Arrow keys
            if (keys['ArrowUp'] || keys['w']) {
                player.y = Math.max(0, player.y - player.speed);
            }
            if (keys['ArrowDown'] || keys['s']) {
                player.y = Math.min(canvas.height - player.height, player.y + player.speed);
            }

            // Player paddle control - Mouse
            const mouseDeadZone = 50;
            if (mouseY < player.y + mouseDeadZone) {
                player.y = Math.max(0, player.y - player.speed);
            } else if (mouseY > player.y + player.height - mouseDeadZone) {
                player.y = Math.min(canvas.height - player.height, player.y + player.speed);
            }

            // Computer AI - follows the ball with some intelligence
            const computerCenter = computer.y + computer.height / 2;
            const ballCenter = ball.y;
            const aiLeadFactor = ball.dx > 0 ? 0.3 : 0;

            if (computerCenter < ballCenter - aiLeadFactor * 50) {
                computer.y = Math.min(canvas.height - computer.height, computer.y + computer.speed);
            } else if (computerCenter > ballCenter + aiLeadFactor * 50) {
                computer.y = Math.max(0, computer.y - computer.speed);
            }

            // Ball movement
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Ball collision with top and bottom walls
            if (ball.y - ball.size < 0 || ball.y + ball.size > canvas.height) {
                ball.dy = -ball.dy;
                ball.y = Math.max(ball.size, Math.min(canvas.height - ball.size, ball.y));
            }

            // Ball collision with player paddle (LEFT)
            if (
                ball.x - ball.size < player.x + player.width &&
                ball.x + ball.size > player.x &&
                ball.y > player.y &&
                ball.y < player.y + player.height &&
                ball.lastPaddleHit !== 'player'
            ) {
                ball.dx = Math.abs(ball.dx);
                ball.x = player.x + player.width + ball.size;

                const collidePoint = (ball.y - (player.y + player.height / 2)) / (player.height / 2);
                ball.dy = collidePoint * ball.speed * 0.5;
                
                if (Math.abs(ball.dx) < ball.maxSpeed) {
                    ball.dx *= 1.05;
                }

                ball.lastPaddleHit = 'player';
            }

            // Ball collision with computer paddle (RIGHT)
            if (
                ball.x + ball.size > computer.x &&
                ball.x - ball.size < computer.x + computer.width &&
                ball.y > computer.y &&
                ball.y < computer.y + computer.height &&
                ball.lastPaddleHit !== 'computer'
            ) {
                ball.dx = -Math.abs(ball.dx);
                ball.x = computer.x - ball.size;

                const collidePoint = (ball.y - (computer.y + computer.height / 2)) / (computer.height / 2);
                ball.dy = collidePoint * ball.speed * 0.5;

                if (Math.abs(ball.dx) < ball.maxSpeed) {
                    ball.dx *= 1.05;
                }

                ball.lastPaddleHit = 'computer';
            }

            // Resetear lastPaddleHit cuando la pelota está en el medio
            if (ball.x > canvas.width / 2 - 50 && ball.x < canvas.width / 2 + 50) {
                ball.lastPaddleHit = null;
            }

            // Ball out of bounds - scoring
            if (ball.x - ball.size < 0) {
                computer.score++;
                playerScoreDisplay.textContent = player.score;
                computerScoreDisplay.textContent = computer.score;
                
                if (checkWinner()) return;
                resetBall();
            } else if (ball.x + ball.size > canvas.width) {
                player.score++;
                playerScoreDisplay.textContent = player.score;
                computerScoreDisplay.textContent = computer.score;
                
                if (checkWinner()) return;
                resetBall();
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() - 0.5) * ball.speed;
            ball.lastPaddleHit = null;
        }

        function draw() {
            // Clear canvas
            context.fillStyle = '#000000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            // Draw game elements
            drawCenterLine();
            drawPaddle(player);
            drawPaddle(computer);
            drawBall();
        }

        // Main game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Restart game
        function restartGame() {
            gameActive = true;
            gameOverScreen.style.display = 'none';
            
            player.score = 0;
            computer.score = 0;
            player.y = canvas.height / 2 - paddleHeight / 2;
            computer.y = canvas.height / 2 - paddleHeight / 2;
            
            playerScoreDisplay.textContent = '0';
            computerScoreDisplay.textContent = '0';
            
            resetBall();
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
