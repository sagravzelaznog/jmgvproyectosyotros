<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Unificado de Proyectos y Cursos</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Local Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background Animated Shapes -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="bg-shape shape3"></div>

    <div class="container">
        <!-- Pantalla de Login -->
        <div id="login-screen" class="glass-panel active-screen">
            <div class="login-header">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1>Portal Unificado</h1>
                <p>Ingresa para acceder a todos los proyectos y cursos</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Correo electrónico" required autocomplete="off">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
                <div id="error-message" class="error-msg hidden-screen"></div>
                <div class="auth-buttons" style="display: flex; gap: 1rem; flex-direction: column;">
                    <button type="submit" class="btn-primary" id="btn-login">
                        Iniciar Sesión <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <button type="button" class="btn-secondary" id="btn-register">
                        Crear Cuenta Nueva
                    </button>
                </div>
            </form>
        </div>

        <!-- Pantalla de Panel/Dashboard -->
        <div id="dashboard-screen" class="glass-panel hidden-screen">
            <header class="dashboard-header">
                <div>
                    <h2>Directorio de Proyectos</h2>
                    <p>Repositorio central de aplicaciones web, cursos y planeaciones didácticas.</p>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span id="user-email-display" style="color: var(--text-muted); font-size: 0.9rem;"></span>
                    <button id="logout-btn" class="btn-logout">
                        <i class="fa-solid fa-right-from-bracket"></i> Salir
                    </button>
                </div>
            </header>
            
            <div id="dynamic-dashboard-content">
                <!-- Se inyectarán dinámicamente las categorías y tarjetas desde script.js -->
            </div>
        </div>
    </div>

    <!-- Firebase App y Auth (Versión 8.10.1 según requerimiento) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <!-- Configuración y Lógica -->
    <script src="env.js"></script>
    <script src="script.js"></script>
</body>
</html>
