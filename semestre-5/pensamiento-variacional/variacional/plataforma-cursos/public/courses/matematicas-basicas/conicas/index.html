            }
        };

        // ==========================================
        // RENDERIZADO DOM Y NAVEGACIÓN
        // ==========================================
        function renderContent(conicName) {
            const data = conicData[conicName];
            const container = document.getElementById('content-container');

            let html = `
                <!-- SECCIÓN DE TEORÍA -->
                <section class="bg-surface rounded-2xl p-5 shadow-lg border border-slate-700/50 animate-fade-in">
                    <h2 class="text-2xl font-bold text-primary mb-4 flex items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        Teoría y Ecuaciones
                    </h2>
                    <p class="text-slate-300 leading-relaxed mb-5 text-sm md:text-base">${data.teoria.definicion}</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-2">
                        <div class="bg-obsidian/80 p-4 rounded-xl border border-slate-700/50">
                            <h3 class="text-accent font-bold mb-3 text-xs uppercase tracking-widest">Formularios</h3>
                            <ul class="space-y-4">
                                ${data.teoria.ecuaciones.map(eq => `
                                    <li class="overflow-x-auto hide-scrollbar pb-1 text-sm text-slate-200">${eq}</li>
                                `).join('')}
                            </ul>
                        </div>
                        <div class="bg-obsidian/80 p-4 rounded-xl border border-slate-700/50">
                            <h3 class="text-warning font-bold mb-3 text-xs uppercase tracking-widest">Elementos Clave</h3>
                            <ul class="space-y-3">
                                ${data.teoria.elementos.map(el => `
                                    <li class="flex items-start gap-3 text-sm text-slate-300">
                                        <div class="w-1.5 h-1.5 rounded-full bg-warning mt-1.5 flex-shrink-0"></div>
                                        <span class="overflow-x-auto hide-scrollbar pb-1">${el}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                </section>

                <!-- SECCIÓN DE EJEMPLOS GUIADOS -->
                <section class="mt-8 animate-fade-in" style="animation-delay: 100ms;">
                    <h2 class="text-2xl font-bold text-primary mb-6 flex items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        Ejemplos Guiados
                    </h2>
                    <div class="space-y-5">
                        ${data.ejemplos.map((ej, index) => `
                            <div class="bg-surface rounded-2xl p-5 shadow-lg border border-slate-700/50 relative overflow-hidden">
                                <div class="absolute top-0 left-0 w-1 h-full bg-primary/80"></div>
                                <h3 class="text-lg font-bold text-white mb-4 ml-1">${ej.titulo}</h3>
                                <div class="space-y-4">
                                    ${ej.pasos.map((paso, i) => `
                                        <div class="flex gap-3">
                                            <div class="flex-shrink-0 w-6 h-6 rounded-full bg-slate-800 border border-slate-600 text-slate-300 flex items-center justify-center text-xs font-bold mt-0.5">${i + 1}</div>
                                            <div class="text-slate-300 overflow-x-auto hide-scrollbar pb-2 text-sm md:text-base leading-relaxed w-full">${paso}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>
                
                <!-- CONTENEDOR PARA LA PRÁCTICA -->
                <section id="practica-container" class="mt-8"></section>
            `;

            container.innerHTML = html;

            renderMathInElement(container, {
                delimiters: [
                    { left: "$$", right: "$$", display: true },
                    { left: "$", right: "$", display: false }
                ],
                throwOnError: false,
                errorColor: "#ef4444"
            });

            renderPractica(conicName);
        }

        function switchTab(conicName) {
            ['circunferencia', 'parabola', 'elipse', 'hiperbola'].forEach(tab => {
                const btn = document.getElementById(`tab-${tab.substring(0, 4)}`);
                if (tab === conicName) {
                    btn.classList.replace('tab-inactive', 'tab-active');
                    btn.setAttribute('aria-selected', 'true');
                } else {
                    btn.classList.replace('tab-active', 'tab-inactive');
                    btn.setAttribute('aria-selected', 'false');
                }
            });
            renderContent(conicName);
        }

        // ==========================================
        // MOTOR DE PRÁCTICA Y EVALUACIÓN
        // ==========================================
        function generarInputsPractica(conicName, index) {
            let campos = [];
            if (conicName === 'circunferencia') {
                campos = [{ id: 'h', label: 'h' }, { id: 'k', label: 'k' }, { id: 'r', label: 'r' }];
            } else if (conicName === 'parabola') {
                campos = [{ id: 'h', label: 'h' }, { id: 'k', label: 'k' }, { id: 'p', label: 'p' }, { id: 'lr', label: 'LR' }];
            } else if (conicName === 'elipse' || conicName === 'hiperbola') {
                campos = [{ id: 'h', label: 'h' }, { id: 'k', label: 'k' }, { id: 'a', label: 'a' }, { id: 'b', label: 'b' }];
            }

            return campos.map(c => `
                <div class="flex flex-col">
                    <label class="text-xs text-slate-400 font-bold mb-1 ml-1 text-center" for="input-${conicName}-${index}-${c.id}">${c.label}</label>
                    <input type="number" step="any" id="input-${conicName}-${index}-${c.id}"
                           class="bg-obsidian border border-slate-600 rounded-xl px-2 py-3 text-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/50 transition-all text-center text-lg w-full shadow-inner"
                           placeholder="0">
                </div>
            `).join('');
        }

        function renderPractica(conicName) {
            const data = conicData[conicName].ejercicios;
            const container = document.getElementById('practica-container');

            container.innerHTML = `
                <div class="bg-surface rounded-2xl p-5 shadow-lg border border-slate-700/50 animate-fade-in">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-2xl font-bold text-accent flex items-center gap-2">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            Práctica y Evaluación
                        </h2>
                    </div>
                    <p class="text-slate-300 text-sm mb-6 border-b border-slate-700/50 pb-4">Ingresa los elementos para cada ecuación. Necesitas acertar 4 de 5 (80%) para aprobar y guardar tu progreso.</p>

                    <div class="space-y-6">
                        ${data.map((ej, i) => `
                            <div class="bg-obsidian/40 rounded-xl p-4 border border-slate-700/50 relative" id="ejercicio-card-${i}">
                                <div class="absolute top-2 left-2 bg-slate-800 text-slate-400 text-xs font-bold px-2 py-1 rounded-md">Q${i + 1}</div>
                                <div class="mb-4 mt-2 text-center overflow-x-auto hide-scrollbar text-lg py-2">${ej.eq}</div>
                                <div class="grid grid-cols-${conicName === 'circunferencia' ? '3' : '4'} gap-2 sm:gap-4 mb-4">
                                    ${generarInputsPractica(conicName, i)}
                                </div>
                                <div id="feedback-${i}" class="min-h-[24px]"></div>
                                
                                <details class="group bg-slate-800/80 rounded-lg mt-2 border border-slate-700 hidden-details" id="solucion-${i}">
                                    <summary class="cursor-pointer px-4 py-3 text-sm font-bold text-slate-300 flex justify-between items-center list-none select-none">
                                        <span>Desarrollo Analítico Oculto</span>
                                        <svg class="w-4 h-4 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </summary>
                                    <div class="px-4 pb-4 pt-2 text-sm text-slate-300 border-t border-slate-700 overflow-x-auto hide-scrollbar bg-obsidian/50 rounded-b-lg">
                                        ${ej.pasos}
                                    </div>
                                </details>
                            </div>
                        `).join('')}
                    </div>

                    <div id="resultado-final" class="hidden mt-6 p-4 rounded-xl text-center font-bold text-lg transition-all"></div>

                    <div class="mt-6 flex flex-col sm:flex-row gap-4">
                        <button id="btn-evaluar" onclick="evaluarPractica('${conicName}')" class="flex-1 bg-gradient-to-r from-primary to-indigo-600 text-white font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(99,102,241,0.4)] hover:shadow-[0_0_25px_rgba(99,102,241,0.6)] active:scale-[0.98] transition-all text-lg flex justify-center items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Calificar Ejercicios
                        </button>
                        <button onclick="renderPractica('${conicName}')" class="flex-1 bg-slate-700 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-slate-600 active:scale-[0.98] transition-all text-lg flex justify-center items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Reintento en Caliente
                        </button>
                    </div>
                </div>
            `;

            renderMathInElement(container, {
                delimiters: [
                    { left: "$$", right: "$$", display: true },
                    { left: "$", right: "$", display: false }
                ]
            });
        }

        async function evaluarPractica(conicName) {
            const data = conicData[conicName].ejercicios;
            let aciertos = 0;

            // Validar que todo esté contestado ANTES de bloquear campos
            const inputsCard = [...document.querySelectorAll('#practica-container input')];
            const vacio = inputsCard.find(inp => inp.value.trim() === '');
            if (vacio) {
                const resVacio = document.getElementById('resultado-final');
                resVacio.className = 'mt-6 p-4 rounded-xl text-center font-bold text-base border bg-warning/20 text-warning border-warning/50';
                resVacio.textContent = 'Completa todos los campos de los 5 ejercicios antes de calificar.';
                vacio.scrollIntoView({ behavior: 'smooth', block: 'center' });
                vacio.focus({ preventScroll: true });
                return;
            }

            const btnEvaluar = document.getElementById('btn-evaluar');
            btnEvaluar.disabled = true;
            btnEvaluar.classList.add('opacity-50', 'cursor-not-allowed');

            data.forEach((ej, i) => {
                let isCorrect = true;
                let campos = [];
                if (conicName === 'circunferencia') campos = ['h', 'k', 'r'];
                if (conicName === 'parabola') campos = ['h', 'k', 'p', 'lr'];
                if (conicName === 'elipse' || conicName === 'hiperbola') campos = ['h', 'k', 'a', 'b'];

                campos.forEach(c => {
                    const inputEl = document.getElementById(`input-${conicName}-${i}-${c}`);
                    const userVal = parseFloat(inputEl.value);
                    const realVal = ej[`ans_${c}`];

                    inputEl.classList.remove('border-slate-600', 'bg-obsidian', 'border-danger', 'bg-danger/10', 'border-accent', 'bg-accent/10');

                    if (isNaN(userVal) || userVal !== realVal) {
                        isCorrect = false;
                        inputEl.classList.add('border-danger', 'bg-danger/20', 'text-red-200');
                    } else {
                        inputEl.classList.add('border-accent', 'bg-accent/20', 'text-green-200');
                    }
                    inputEl.disabled = true;
                });

                const feedback = document.getElementById(`feedback-${i}`);
                const solucion = document.getElementById(`solucion-${i}`);

                if (isCorrect) {
                    aciertos++;
                    feedback.innerHTML = `<span class="text-accent text-sm font-bold flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> ¡Elementos identificados correctamente!</span>`;
                } else {
                    feedback.innerHTML = `<span class="text-danger text-sm font-bold flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg> Hay errores. Revisa el procedimiento.</span>`;
                }

                solucion.open = true;
            });

            const resBox = document.getElementById('resultado-final');
            resBox.classList.remove('hidden', 'bg-danger/20', 'text-danger', 'border-danger/50', 'bg-accent/20', 'text-accent', 'border-accent/50', 'bg-warning/20', 'text-warning', 'border-warning/50');
            resBox.classList.add('border');

            const scorePercent = (aciertos / 5) * 100;

            if (aciertos >= 4) {
                resBox.classList.add('bg-accent/20', 'text-accent', 'border-accent/50');
                resBox.innerHTML = `🌟 ¡Excelente! Aprobaste con ${aciertos}/5 (${scorePercent}%). <span id="save-status" class="block text-sm font-semibold mt-1 opacity-90">Guardando progreso...</span>`;

                let estado = 'local';
                if (window.guardarProgresoFirebase) {
                    estado = await window.guardarProgresoFirebase(conicName, scorePercent, aciertos);
                }
                const st = document.getElementById('save-status');
                if (st) {
                    st.textContent = estado === 'ok' ? '✓ Progreso guardado en tu cuenta.'
                        : estado === 'error' ? '✖ No se pudo guardar el progreso (error de conexión).'
                        : '⚠ Evaluado localmente (inicia sesión para guardar tu progreso).';
                }
            } else {
                resBox.classList.add('bg-danger/20', 'text-danger', 'border-danger/50');
                resBox.innerHTML = `⚠️ Puntuación: ${aciertos}/5 (${scorePercent}%). Necesitas 80% (4/5) para aprobar. Revisa los pasos y usa el "Reintento en Caliente".`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            switchTab('circunferencia');
        });
    </script>

    <!-- ========================================== -->
    <!-- FIREBASE SDK V10 MODULAR                   -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWi_ko-0i-esAuNiO5EIQe-gThnQ1-iaM",
            authDomain: "calculointegral-2601b.firebaseapp.com",
            projectId: "calculointegral-2601b",
            storageBucket: "calculointegral-2601b.firebasestorage.app",
            messagingSenderId: "818910932073",
            appId: "1:818910932073:web:b7e2e4bbd4033d250386f8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // IMPORTANTE: no se usa signInAnonymously. La app corre dentro de la plataforma (mismo origen),
        // así que reutiliza la sesión del alumno; un login anónimo la reemplazaría.
        onAuthStateChanged(auth, (user) => {
            window.currentUserUID = user ? user.uid : null;
            const statusIcon = document.getElementById('auth-status');
            if (statusIcon && user) {
                statusIcon.classList.replace('bg-slate-700', 'bg-accent/20');
                statusIcon.classList.replace('border-slate-600', 'border-accent');
                statusIcon.querySelector('svg').classList.replace('text-slate-400', 'text-accent');
            }
            console.log(user ? `Sesión activa: ${user.uid}` : 'Modo local (sin sesión activa).');
        });

        // Devuelve 'ok' | 'local' | 'error'
        window.guardarProgresoFirebase = async (moduloId, score, aciertos) => {
            if (!window.currentUserUID) return 'local';
            try {
                const ref = doc(db, "estudiantes", window.currentUserUID, "progreso_sesiones", `sesion_conicas_${moduloId}`);
                await setDoc(ref, {
                    tema: `Cónicas: ${moduloId}`,
                    aciertos: aciertos,
                    calificacion: score,
                    umbralAprobatorio: 4,
                    resultado: "Aprobado",
                    ultimaPractica: serverTimestamp()
                }, { merge: true });
                return 'ok';
            } catch (error) {
                console.error("[Firebase] Error al guardar progreso:", error);
                return 'error';
            }
        };
    </script>
