<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-4 md:p-8">

    <header class="w-full max-w-4xl text-center mb-10 mt-6 space-y-4">

            Estudia los ejemplos para comprender cómo intercambiar las columnas en las matrices \( \Delta_x \) y \( \Delta_y \), y luego pon a prueba tu conocimiento.

    <main id="app-container" class="w-full max-w-4xl flex-grow flex flex-col gap-8">

    </main>

    <footer class="w-full max-w-4xl text-center mt-12 py-6 border-t border-slate-200 text-sm text-slate-500 font-mono tracking-widest">

    <!-- Lógica de Estado 0: Motor Matemático -->
    <script>
        // Función para formatear términos algebraicos globalmente
        window.formatTerm = function (coef, variable, isFirst = false) {
            if (coef === 0) return "";
            let sign = coef < 0 ? "-" : "+";
            let strSign = isFirst ? (coef < 0 ? "-" : "") : ` ${sign} `;
            let absCoef = Math.abs(coef);
            let strCoef = (absCoef === 1 && variable !== "") ? "" : absCoef;
            return `${strSign}${strCoef}${variable}`;
        };

        function getRandomInt(min, max, avoidZero = true) {
            let val = 0;
            do {
                val = Math.floor(Math.random() * (max - min + 1)) + min;
            } while (avoidZero && val === 0);
            return val;
        }

        // Generador de un sistema de ecuaciones para Regla de Cramer
        function generateSystem() {
            let A1, B1, A2, B2, detS;
            do {
                A1 = getRandomInt(-9, 9);
                B1 = getRandomInt(-9, 9);
                A2 = getRandomInt(-9, 9);
                B2 = getRandomInt(-9, 9);
                detS = A1 * B2 - B1 * A2;
            } while (detS === 0); // El determinante del sistema JAMÁS debe ser 0
            
            // Forzamos soluciones enteras
            const x = getRandomInt(-15, 15, false);
            const y = getRandomInt(-15, 15, false);
            
            const C1 = A1 * x + B1 * y;
            const C2 = A2 * x + B2 * y;
            
            // Calculamos detX y detY para validación interna
            const detX = C1 * B2 - B1 * C2;
            const detY = A1 * C2 - C1 * A2;
            
            return { A1, B1, C1, A2, B2, C2, x, y, detS, detX, detY };
        }

        // Arrays de datos matemáticos
        window.ejemplosData = [];
        window.practicaData = [];

        // Generamos los 10 sistemas (5 ejemplos y 5 ejercicios)
        for (let i = 0; i < 5; i++) {
            window.ejemplosData.push(generateSystem());
            window.practicaData.push(generateSystem());
        }
        
        // [ESTADO 1: Ejemplos Guiados]
        function formatFraction(num, den) {
            if (den === 1) return `\\frac{${num}}{1}`;
            if (den === -1) return `\\frac{${num}}{-1}`;
            return `\\frac{${num}}{${den}}`;
        }

        function formatMatrixCrossMultiplication(a, b, c, d) {
            return `(${a})(${d}) - (${b})(${c})`;
        }

        function formatMatrixResult(a, b, c, d) {
            const part1 = a * d;
            const part2 = b * c;
            // Evaluamos la resta
            const strPart2 = part2 < 0 ? `+ ${Math.abs(part2)}` : `- ${part2}`;
            const total = part1 - part2;
            return `${part1} ${strPart2} = ${total}`;
        }

        function buildStepByStepCramer(sys) {
            const { A1, B1, C1, A2, B2, C2, x, y, detS, detX, detY } = sys;

            const matrixS = `\\Delta_s = \\begin{vmatrix} ${A1} & ${B1} \\\\ ${A2} & ${B2} \\end{vmatrix}`;
            const crossS = formatMatrixCrossMultiplication(A1, B1, A2, B2);
            const resS = formatMatrixResult(A1, B1, A2, B2);

            // Reemplazando la columna x por los términos independientes (C1, C2)
            const matrixX = `\\Delta_x = \\begin{vmatrix} ${C1} & ${B1} \\\\ ${C2} & ${B2} \\end{vmatrix}`;
            const crossX = formatMatrixCrossMultiplication(C1, B1, C2, B2);
            const resX = formatMatrixResult(C1, B1, C2, B2);

            // Reemplazando la columna y por los términos independientes (C1, C2)
            const matrixY = `\\Delta_y = \\begin{vmatrix} ${A1} & ${C1} \\\\ ${A2} & ${C2} \\end{vmatrix}`;
            const crossY = formatMatrixCrossMultiplication(A1, C1, A2, C2);
            const resY = formatMatrixResult(A1, C1, A2, C2);

            return `
                <div class="mt-4 p-5 bg-cyan-50 border border-cyan-200 rounded-lg text-sm md:text-base text-gray-800 space-y-5">
                    
                    <div>
                        <p class="font-bold text-cyan-800 mb-2">Paso 1: Calcular el Determinante del Sistema (\\( \\Delta_s \\))</p>
                        <p class="text-slate-700 text-sm mb-2">Construimos la matriz con los coeficientes originales de \\( x \\) y \\( y \\).</p>
                        <div class="overflow-x-auto text-center w-full py-2 text-xl">
                            $$ ${matrixS} = ${crossS} = ${resS} $$
                        </div>
                    </div>
                    
                    <hr class="border-cyan-300">
                    
                    <div>
                        <p class="font-bold text-cyan-800 mb-2">Paso 2: Calcular el Determinante de \\( x \\) (\\( \\Delta_x \\))</p>
                        <p class="text-slate-700 text-sm mb-2">Reemplazamos la primera columna (la de \\( x \\)) por los términos independientes \\( ${C1} \\) y \\( ${C2} \\).</p>
                        <div class="overflow-x-auto text-center w-full py-2 text-xl">
                            $$ ${matrixX} = ${crossX} = ${resX} $$
                        </div>
                    </div>
                    
                    <hr class="border-cyan-300">
                    
                    <div>
                        <p class="font-bold text-cyan-800 mb-2">Paso 3: Calcular el Determinante de \\( y \\) (\\( \\Delta_y \\))</p>
                        <p class="text-slate-700 text-sm mb-2">Reemplazamos la segunda columna (la de \\( y \\)) por los términos independientes \\( ${C1} \\) y \\( ${C2} \\).</p>
                        <div class="overflow-x-auto text-center w-full py-2 text-xl">
                            $$ ${matrixY} = ${crossY} = ${resY} $$
                        </div>
                    </div>
                    
                    <hr class="border-cyan-300">
                    
                    <div>
                        <p class="font-bold text-cyan-800 mb-2">Paso 4: Calcular \\( x \\) e \\( y \\)</p>
                        <p class="text-slate-700 text-sm mb-2">Dividimos los determinantes de cada variable entre el determinante del sistema.</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-center text-xl mt-2">
                            <div class="bg-white p-3 rounded-xl border border-cyan-100 shadow-sm">
                                $$ x = \\frac{\\Delta_x}{\\Delta_s} = \\frac{${detX}}{${detS}} = ${x} $$
                            </div>
                            <div class="bg-white p-3 rounded-xl border border-cyan-100 shadow-sm">
                                $$ y = \\frac{\\Delta_y}{\\Delta_s} = \\frac{${detY}}{${detS}} = ${y} $$
                            </div>
                        </div>
                    </div>

                    <div class="bg-cyan-700 p-4 rounded-xl text-center shadow-md mt-4">
                        <p class="font-bold text-cyan-100 tracking-wide uppercase text-xs">Solución Final</p>
                        <div class="text-xl mt-1 text-white font-bold">
                            $$ (x, y) = (${x}, ${y}) $$
                        </div>
                    </div>
                </div>
            `;
        }

        function renderEjemplos() {
            const container = document.getElementById('app-container');
            
            const sectionHTML = document.createElement('section');
            sectionHTML.id = "ejemplos-section";
            sectionHTML.innerHTML = '<h3 class="text-2xl md:text-3xl font-bold text-cyan-700 mt-4 mb-6 border-b-2 border-cyan-200 pb-2">Ejemplos Guiados (Regla de Cramer)</h3>';
            
            window.ejemplosData.forEach((sys, index) => {
                const eq1KaTeX = `${window.formatTerm(sys.A1, 'x', true)} ${window.formatTerm(sys.B1, 'y')} = ${sys.C1}`;
                const eq2KaTeX = `${window.formatTerm(sys.A2, 'x', true)} ${window.formatTerm(sys.B2, 'y')} = ${sys.C2}`;
                const systemKaTeX = `\\begin{cases} ${eq1KaTeX} \\\\ ${eq2KaTeX} \\end{cases}`;

                const stepByStepHTML = buildStepByStepCramer(sys);

                const cardHTML = `
                    <article class="bg-white border border-cyan-200 rounded-2xl p-6 md:p-8 shadow-sm relative transition-all duration-300 mb-8" id="ejemplo-card-${index}">
                        <div class="absolute -top-5 -left-4 bg-cyan-600 text-white w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold shadow-lg ring-4 ring-white">
                            E${index + 1}
                        </div>
                        
                        <div class="text-xl md:text-2xl overflow-x-auto w-full flex justify-center py-6 bg-cyan-50/50 rounded-xl border border-cyan-100 mb-6">
                            $$ ${systemKaTeX} $$
                        </div>

                        ${stepByStepHTML}
                    </article>
                `;
                sectionHTML.insertAdjacentHTML('beforeend', cardHTML);
            });
            
            container.appendChild(sectionHTML);
        }
        
        function renderPractica() {
            const container = document.getElementById('app-container');
            
            const sectionHTML = document.createElement('section');
            sectionHTML.id = "practica-section";
            sectionHTML.innerHTML = `
                <h3 class="text-2xl md:text-3xl font-bold text-cyan-700 mt-12 mb-6 border-b-2 border-cyan-200 pb-2">Ejercicios de Práctica</h3>
                <div id="practica-cards-container" class="flex flex-col gap-8"></div>
                <div id="controles-evaluacion" class="w-full flex flex-col items-center mt-6 mb-12">
                    <button id="btn-submit" class="bg-cyan-600 hover:bg-cyan-700 transition-colors text-white font-extrabold py-4 px-12 rounded-xl shadow-lg text-xl w-full md:w-auto uppercase tracking-wide">
                        Verificar Respuestas
                    </button>
                    <div id="evaluation-feedback" class="mt-8 w-full text-center hidden max-w-2xl mx-auto"></div>
                </div>
            `;
            container.appendChild(sectionHTML);
            
            const cardsContainer = document.getElementById('practica-cards-container');

            window.practicaData.forEach((sys, index) => {
                const eq1KaTeX = `${window.formatTerm(sys.A1, 'x', true)} ${window.formatTerm(sys.B1, 'y')} = ${sys.C1}`;
                const eq2KaTeX = `${window.formatTerm(sys.A2, 'x', true)} ${window.formatTerm(sys.B2, 'y')} = ${sys.C2}`;
                const systemKaTeX = `\\begin{cases} ${eq1KaTeX} \\\\ ${eq2KaTeX} \\end{cases}`;

                const stepByStepHTML = buildStepByStepCramer(sys);

                const cardHTML = `
                    <article class="bg-white border border-cyan-200 rounded-2xl p-6 md:p-8 shadow-sm relative transition-all duration-300" id="practica-card-${index}">
                        <div class="absolute -top-5 -left-4 bg-cyan-600 text-white w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold shadow-lg ring-4 ring-white">
                            #${index + 1}
                        </div>
                        
                        <div class="flex flex-col lg:flex-row items-center justify-between gap-8">
                            <div class="text-xl md:text-2xl overflow-x-auto w-full lg:w-1/2 flex justify-center py-6 bg-cyan-50/50 rounded-xl border border-cyan-100">
                                $$ ${systemKaTeX} $$
                            </div>

                            <div class="flex flex-col gap-4 w-full lg:w-1/2 bg-gray-50 p-6 rounded-xl border border-gray-200 shadow-inner relative">
                                <div class="flex items-center gap-4">
                                    <label for="ans-x-${index}" class="font-bold text-xl text-gray-700 w-12 text-right">\\( x = \\)</label>
                                    <input type="number" id="ans-x-${index}" class="practica-input border-2 border-gray-300 focus:border-cyan-500 focus:ring focus:ring-cyan-200 rounded-lg px-4 py-3 w-full transition-all text-center text-xl font-bold text-gray-800 shadow-sm" placeholder="Valor de x">
                                </div>
                                <div class="flex items-center gap-4">
                                    <label for="ans-y-${index}" class="font-bold text-xl text-gray-700 w-12 text-right">\\( y = \\)</label>
                                    <input type="number" id="ans-y-${index}" class="practica-input border-2 border-gray-300 focus:border-cyan-500 focus:ring focus:ring-cyan-200 rounded-lg px-4 py-3 w-full transition-all text-center text-xl font-bold text-gray-800 shadow-sm" placeholder="Valor de y">
                                </div>
                                
                                <!-- Solución Oculta Directa -->
                                <div id="correct-ans-${index}" class="hidden mt-2 bg-emerald-100 text-emerald-800 border border-emerald-300 p-3 rounded-lg text-center font-bold text-lg shadow-sm transition-all duration-500">
                                    Solución: \\( x = ${sys.x}, \\ y = ${sys.y} \\)
                                </div>
                            </div>
                        </div>

                        <details class="mt-6 group" id="details-practica-${index}">
                            <summary class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3 px-5 rounded-lg transition-colors list-none flex justify-between items-center shadow-md">
                                <span class="flex items-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    Mostrar Desarrollo Paso a Paso
                                </span>
                                <span class="transform group-open:rotate-180 transition-transform duration-300">▼</span>
                            </summary>
                            ${stepByStepHTML}
                        </details>
                    </article>
                `;
                cardsContainer.insertAdjacentHTML('beforeend', cardHTML);
            });

            document.getElementById('btn-submit').addEventListener('click', evaluateExercises);
        }

        function evaluateExercises() {
            let correctCount = 0;
            const total = window.practicaData.length;

            for (let i = 0; i < total; i++) {
                const sys = window.practicaData[i];
                const inputX = document.getElementById(`ans-x-${i}`);
                const inputY = document.getElementById(`ans-y-${i}`);
                const card = document.getElementById(`practica-card-${i}`);
                const details = document.getElementById(`details-practica-${i}`);
                const correctBadge = document.getElementById(`correct-ans-${i}`);

                const valX = parseInt(inputX.value, 10);
                const valY = parseInt(inputY.value, 10);

                inputX.classList.remove('border-red-500', 'bg-red-50', 'text-red-700', 'border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                inputY.classList.remove('border-red-500', 'bg-red-50', 'text-red-700', 'border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                card.classList.remove('ring-2', 'ring-emerald-400', 'border-emerald-400', 'ring-red-400', 'border-red-400');

                if (valX === sys.x && valY === sys.y) {
                    correctCount++;
                    inputX.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                    inputY.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                    card.classList.add('ring-2', 'ring-emerald-400', 'border-emerald-400');
                } else {
                    if (valX !== sys.x) inputX.classList.add('border-red-500', 'bg-red-50', 'text-red-700');
                    else inputX.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');

                    if (valY !== sys.y) inputY.classList.add('border-red-500', 'bg-red-50', 'text-red-700');
                    else inputY.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');

                    card.classList.add('ring-2', 'ring-red-400', 'border-red-400');
                    correctBadge.classList.remove('hidden');
                }

                details.open = false;

                inputX.disabled = true;
                inputY.disabled = true;
            }

            renderFeedback(correctCount, total);
        }

        function renderFeedback(correctCount, total) {
            const btnSubmit = document.getElementById('btn-submit');
            const feedbackContainer = document.getElementById('evaluation-feedback');

            btnSubmit.classList.add('hidden');
            feedbackContainer.classList.remove('hidden');

            const passed = correctCount >= 4;

            if (passed) {
                feedbackContainer.innerHTML = `
                    <div class="bg-emerald-100 border-2 border-emerald-300 text-emerald-900 p-8 rounded-2xl shadow-md">
                        <h3 class="text-3xl font-extrabold mb-3">¡Misión Cumplida!</h3>
                        <p class="text-xl mb-4">Aprobaste la práctica con ${correctCount} de ${total} sistemas correctos.</p>
                        <div id="firebase-status" class="bg-white px-4 py-3 rounded-lg text-sm font-semibold text-emerald-600 border border-emerald-200">
                            Sincronizando progreso...
                        </div>
                    </div>
                `;
                document.dispatchEvent(new CustomEvent('practicaAprobada', { detail: { score: correctCount } }));
            } else {
                feedbackContainer.innerHTML = `
                    <div class="bg-red-100 border-2 border-red-300 text-red-900 p-8 rounded-2xl shadow-md">
                        <h3 class="text-3xl font-extrabold mb-3">Puntuación Insuficiente</h3>
                        <p class="text-xl mb-6">Obtuviste ${correctCount} de ${total}. Necesitas al menos un 80% (4/5) para aprobar.</p>
                        <button id="btn-retry" class="bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-10 rounded-xl shadow-lg transition-colors text-lg uppercase tracking-wider">
                            Reintento en Caliente
                        </button>
                    </div>
                `;
                document.getElementById('btn-retry').addEventListener('click', hotRetry);
            }
        }

        function hotRetry() {
            const total = window.practicaData.length;

            for (let i = 0; i < total; i++) {
                const inputX = document.getElementById(`ans-x-${i}`);
                const inputY = document.getElementById(`ans-y-${i}`);
                const card = document.getElementById(`practica-card-${i}`);
                const details = document.getElementById(`details-practica-${i}`);
                const correctBadge = document.getElementById(`correct-ans-${i}`);

                inputX.disabled = false;
                inputY.disabled = false;
                inputX.value = '';
                inputY.value = '';

                inputX.className = "practica-input border-2 border-gray-300 focus:border-cyan-500 focus:ring focus:ring-cyan-200 rounded-lg px-4 py-3 w-full transition-all text-center text-xl font-bold text-gray-800 shadow-sm";
                inputY.className = "practica-input border-2 border-gray-300 focus:border-cyan-500 focus:ring focus:ring-cyan-200 rounded-lg px-4 py-3 w-full transition-all text-center text-xl font-bold text-gray-800 shadow-sm";

                card.classList.remove('ring-2', 'ring-emerald-400', 'border-emerald-400', 'ring-red-400', 'border-red-400');

                details.open = false;
                if(correctBadge) correctBadge.classList.add('hidden');
            }

            const btnSubmit = document.getElementById('btn-submit');
            const feedbackContainer = document.getElementById('evaluation-feedback');

            feedbackContainer.classList.add('hidden');
            btnSubmit.classList.remove('hidden');

            document.getElementById('practica-card-0').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        // Inicialización de KaTeX global y renderizado
        document.addEventListener("DOMContentLoaded", function() {
            renderEjemplos();
            renderPractica();

            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError : false
                });
            }
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Credenciales oficiales de la plataforma
        const firebaseConfig = {
            apiKey: "AIzaSyCWi_ko-0i-esAuNiO5EIQe-gThnQ1-iaM",
            authDomain: "calculointegral-2601b.firebaseapp.com",
            projectId: "calculointegral-2601b",
            storageBucket: "calculointegral-2601b.firebasestorage.app",
            messagingSenderId: "818910932073",
            appId: "1:818910932073:web:b7e2e4bbd4033d250386f8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                console.log("Sesión activa detectada.");
            } else {
                console.log("Modo Invitado.");
            }
        });

        async function saveProgressToFirebase(score) {
            const statusElement = document.getElementById('firebase-status');
            if (!statusElement) return;

            try {
                if (currentUser) {
                    const progressRef = doc(db, "estudiantes", currentUser.uid, "progreso_sesiones", "sesion_cramer");
                    await setDoc(progressRef, {
                        tema: "Sistemas 2x2: Regla de Cramer",
                        score: score,
                        aprobado: true,
                        timestamp: serverTimestamp()
                    }, { merge: true });
                    statusElement.innerHTML = "✅ Progreso registrado exitosamente en Firebase.";
                } else {
                    statusElement.innerHTML = "⚠ Evaluación completada localmente (Modo Invitado).";
                    statusElement.classList.add('text-amber-600');
                    statusElement.classList.remove('text-emerald-600');
                }
            } catch (error) {
                console.error("Error al guardar en Firebase:", error);
                statusElement.innerHTML = "❌ Fallo de conexión al guardar el progreso.";
                statusElement.classList.add('text-red-600');
                statusElement.classList.remove('text-emerald-600');
            }
        }

        document.addEventListener('practicaAprobada', (e) => {
            saveProgressToFirebase(e.detail.score);
        });
    </script>
</body>
</html>
