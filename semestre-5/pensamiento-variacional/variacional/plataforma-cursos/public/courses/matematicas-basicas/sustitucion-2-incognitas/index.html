<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas 2x2: Método de Sustitución</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Suaves animaciones para el acordeón y UI */
            scroll-behavior: smooth;
        }
        details > summary {
            list-style: none;
        }
        details > summary::-webkit-details-marker {
            display: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex flex-col items-center p-4 md:p-8">

    <header class="w-full max-w-4xl text-center mb-10 mt-6 space-y-4">
        <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-emerald-400 drop-shadow-sm">
            Práctica de Álgebra
        </h1>
        <h2 class="text-2xl font-semibold text-slate-300">Solución de Sistemas 2x2: <span class="text-emerald-400">Sustitución</span></h2>
        <p class="text-slate-400 max-w-2xl mx-auto">
            Resuelve cada uno de los sistemas de ecuaciones lineales encontrando los valores para $x$ e $y$. 
            Puedes consultar el desglose paso a paso después de intentar cada ejercicio.
        </p>
    </header>

    <main id="app-container" class="w-full max-w-4xl flex-grow flex flex-col gap-8">
        <!-- Aquí se inyectarán los ejercicios dinámicamente mediante JS en el Estado 1 -->
    </main>

    <footer class="w-full max-w-4xl text-center mt-12 py-6 border-t border-slate-700/50 text-sm text-slate-500 font-mono tracking-widest">
        JMGV-PTEL 2026. PM1 MC 09. TODOS LOS DERECHOS RESERVADOS.
    </footer>

    <!-- Lógica de la Aplicación -->
    <script>
        // [EL MOTOR MATEMÁTICO]
        
        // Función auxiliar para formatear términos algebraicos
        function formatTerm(coef, variable, isFirst) {
            if (coef === 0) return '';
            let absCoef = Math.abs(coef);
            let sign = coef < 0 ? '-' : '+';
            // Ocultar el coeficiente 1 solo si la variable no es vacía y no empieza con '('
            let coefStr = (absCoef === 1 && variable !== '' && !variable.startsWith('(')) ? '' : absCoef;
            
            if (isFirst) {
                return `${coef < 0 ? '-' : ''}${coefStr}${variable}`;
            } else {
                return `${sign} ${coefStr}${variable}`;
            }
        }

        // Función para formatear una ecuación completa
        function formatEq(A, B, C) {
            let termA = formatTerm(A, 'x', true);
            let termB = formatTerm(B, 'y', termA === '');
            return `${termA} ${termB} = ${C}`.trim();
        }

        // Generador de números aleatorios excluyendo el 0
        function getRandomInt(min, max) {
            let val = 0;
            while(val === 0) {
                val = Math.floor(Math.random() * (max - min + 1)) + min;
            }
            return val;
        }

        // Generador de un sistema de ecuaciones con solución única y entera
        function generateSystem() {
            let A, B, D, E, det;
            do {
                A = getRandomInt(-9, 9);
                B = getRandomInt(-9, 9);
                D = getRandomInt(-9, 9);
                E = getRandomInt(-9, 9);
                det = A * E - B * D;
            } while (det === 0);
            
            const x = Math.floor(Math.random() * 21) - 10;
            const y = Math.floor(Math.random() * 21) - 10;
            
            const C = A * x + B * y;
            const F = D * x + E * y;
            
            return { A, B, C, D, E, F, x, y };
        }

        // Generador del desglose paso a paso usando interpolación KaTeX
        function generateStepByStep(sys) {
            const { A, B, C, D, E, F, x, y } = sys;
            
            let paso1 = `$$ ${formatEq(A, B, C)} \\implies ${formatTerm(A, 'x', true)} = ${C} ${formatTerm(-B, 'y', false)} \\implies x = \\frac{${C} ${formatTerm(-B, 'y', false)}}{${A}} $$`;
            
            let paso2 = `$$ ${D}\\left( \\frac{${C} ${formatTerm(-B, 'y', false)}}{${A}} \\right) ${formatTerm(E, 'y', false)} = ${F} $$`;
            
            let multD_C = D * C;
            let multD_mB = D * (-B);
            let paso3 = `Multiplicando por $${A}$ para eliminar el denominador y distribuyendo:<br>`;
            paso3 += `$$ ${D}(${C} ${formatTerm(-B, 'y', false)}) ${formatTerm(A*E, 'y', false)} = ${A*F} $$`;
            paso3 += `$$ ${multD_C} ${formatTerm(multD_mB, 'y', false)} ${formatTerm(A*E, 'y', false)} = ${A*F} $$`;
            
            let sumY = multD_mB + A * E;
            let num = A * F - multD_C;
            paso3 += `$$ ${formatTerm(sumY, 'y', true)} = ${A*F} ${formatTerm(-multD_C, '', false)} $$`;
            paso3 += `$$ ${formatTerm(sumY, 'y', true)} = ${num} \\implies y = \\frac{${num}}{${sumY}} \\implies y = ${y} $$`;
            
            let paso4 = `$$ x = \\frac{${C} ${formatTerm(-B, `(${y})`, false)}}{${A}} $$`;
            let numX = C + (-B) * y;
            paso4 += `$$ x = \\frac{${C} ${formatTerm(-B*y, '', false)}}{${A}} = \\frac{${numX}}{${A}} \\implies x = ${x} $$`;

            return `
                <div class="text-slate-300 space-y-4 text-sm md:text-base">
                    <div>
                        <strong class="text-emerald-400">Paso 1:</strong> Despejamos $x$ en la primera ecuación.
                        ${paso1}
                    </div>
                    <div>
                        <strong class="text-emerald-400">Paso 2:</strong> Sustituimos este despeje en la segunda ecuación.
                        ${paso2}
                    </div>
                    <div>
                        <strong class="text-emerald-400">Paso 3:</strong> Resolvemos la ecuación lineal resultante para obtener $y$.
                        ${paso3}
                    </div>
                    <div>
                        <strong class="text-emerald-400">Paso 4:</strong> Sustituimos el valor de $y$ en el despeje original para encontrar $x$.
                        ${paso4}
                    </div>
                </div>
            `;
        }

        // Variables globales
        const systemSolutions = [];

        // Función para renderizar los ejercicios y ejemplos
        function renderApp() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';
            systemSolutions.length = 0;

            // --- SECCIÓN DE EJEMPLOS ---
            const examplesHeader = document.createElement('h3');
            examplesHeader.className = "text-2xl md:text-3xl font-bold text-blue-400 mb-6 border-b border-slate-700 pb-2 mt-4";
            examplesHeader.innerText = "Ejemplos Resueltos";
            container.appendChild(examplesHeader);
            
            for (let i = 0; i < 5; i++) {
                const sys = generateSystem();
                
                const article = document.createElement('article');
                article.className = "bg-slate-800/80 rounded-xl p-6 shadow-lg border border-slate-700/50 mb-8";
                
                article.innerHTML = `
                    <div class="mb-4">
                        <h4 class="text-lg font-bold text-blue-300 mb-2">Ejemplo ${i + 1}</h4>
                        <div class="text-xl overflow-x-auto overflow-y-hidden py-2 min-h-[80px] flex items-center">
                            $$ 
                            \\begin{cases} 
                            ${formatEq(sys.A, sys.B, sys.C)} \\\\ 
                            ${formatEq(sys.D, sys.E, sys.F)} 
                            \\end{cases} 
                            $$
                        </div>
                    </div>
                    <div class="p-5 border border-slate-700 bg-slate-900/60 rounded-lg">
                        ${generateStepByStep(sys)}
                    </div>
                `;
                container.appendChild(article);
            }

            // --- SECCIÓN DE EJERCICIOS ---
            const exercisesHeader = document.createElement('h3');
            exercisesHeader.className = "text-2xl md:text-3xl font-bold text-indigo-400 mt-12 mb-6 border-b border-slate-700 pb-2";
            exercisesHeader.innerText = "Ejercicios de Práctica";
            container.appendChild(exercisesHeader);

            for (let i = 0; i < 5; i++) {
                const sys = generateSystem();
                systemSolutions.push({ x: sys.x, y: sys.y });

                const article = document.createElement('article');
                article.className = "bg-slate-800 rounded-xl p-6 shadow-lg border border-slate-700/50 exercise-card transition-all mb-8";
                
                article.innerHTML = `
                    <div class="flex flex-col md:flex-row gap-6 md:items-center justify-between mb-6">
                        <div class="flex-grow">
                            <h4 class="text-lg font-bold text-indigo-300 mb-2">Ejercicio ${i + 1}</h4>
                            <div class="text-xl overflow-x-auto overflow-y-hidden py-2 min-h-[80px] flex items-center">
                                $$ 
                                \\begin{cases} 
                                ${formatEq(sys.A, sys.B, sys.C)} \\\\ 
                                ${formatEq(sys.D, sys.E, sys.F)} 
                                \\end{cases} 
                                $$
                            </div>
                        </div>
                        <div class="flex flex-col gap-3 min-w-[200px]">
                            <div class="flex items-center gap-3">
                                <label class="font-mono text-lg text-emerald-400 font-bold">x =</label>
                                <input type="number" id="input-x-${i}" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white font-mono focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition-colors">
                            </div>
                            <div class="flex items-center gap-3">
                                <label class="font-mono text-lg text-emerald-400 font-bold">y =</label>
                                <input type="number" id="input-y-${i}" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white font-mono focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition-colors">
                            </div>
                        </div>
                    </div>
                    
                    <details class="group border border-slate-700 rounded-lg bg-slate-900/50 overflow-hidden mt-4">
                        <summary class="cursor-pointer p-4 font-semibold text-slate-300 hover:text-white hover:bg-slate-700/30 transition-all flex justify-between items-center">
                            <span>Ver paso a paso (¡Inténtalo tú primero!)</span>
                            <svg class="w-5 h-5 transform group-open:rotate-180 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </summary>
                        <div class="p-4 border-t border-slate-700 bg-slate-800/50">
                            ${generateStepByStep(sys)}
                        </div>
                    </details>
                `;
                container.appendChild(article);
            }

            // Botón de Evaluación
            const actionsDiv = document.createElement('div');
            actionsDiv.id = 'actions-container';
            actionsDiv.className = 'w-full flex justify-center mt-6 mb-12';
            actionsDiv.innerHTML = `
                <button id="btn-evaluar" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-10 rounded-lg shadow-lg hover:shadow-emerald-500/30 transition-all text-lg transform hover:-translate-y-1">
                    Evaluar Respuestas
                </button>
            `;
            container.appendChild(actionsDiv);

            // Renderizar matemáticas de KaTeX
            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError : false
                });
            }
        }

        document.addEventListener("DOMContentLoaded", renderApp);

        // [EL INGENIERO DE ESTADO]
        document.addEventListener('click', function(e) {
            if (e.target && e.target.id === 'btn-evaluar') {
                evaluarRespuestas();
            } else if (e.target && e.target.id === 'btn-reintento') {
                reintentoEnCaliente();
            }
        });

        function evaluarRespuestas() {
            let aciertos = 0;
            const articles = document.querySelectorAll('.exercise-card');
            
            for (let i = 0; i < 5; i++) {
                const inputX = document.getElementById(`input-x-${i}`);
                const inputY = document.getElementById(`input-y-${i}`);
                const valX = parseInt(inputX.value);
                const valY = parseInt(inputY.value);
                
                const expectedX = systemSolutions[i].x;
                const expectedY = systemSolutions[i].y;
                
                let correct = false;
                if (!isNaN(valX) && !isNaN(valY) && valX === expectedX && valY === expectedY) {
                    aciertos++;
                    correct = true;
                }
                
                // Feedback visual
                if (correct) {
                    articles[i].classList.add('border-emerald-500', 'bg-emerald-900/20');
                    articles[i].classList.remove('border-slate-700/50', 'border-red-500', 'bg-red-900/20');
                } else {
                    articles[i].classList.add('border-red-500', 'bg-red-900/20');
                    articles[i].classList.remove('border-slate-700/50', 'border-emerald-500', 'bg-emerald-900/20');
                }
                
                // Deshabilitar inputs
                inputX.disabled = true;
                inputY.disabled = true;
            }
            
            const actionsDiv = document.getElementById('actions-container');
            if (aciertos >= 4) {
                actionsDiv.innerHTML = `
                    <div class="flex flex-col items-center gap-4">
                        <div class="text-2xl font-bold text-emerald-400">¡Aprobado! ${aciertos}/5 aciertos.</div>
                        <p class="text-emerald-200">Guardando progreso...</p>
                    </div>
                `;
                // Disparar evento personalizado para la capa de persistencia (Firebase)
                const event = new CustomEvent('progresoAprobado', { detail: { score: aciertos } });
                document.dispatchEvent(event);
            } else {
                actionsDiv.innerHTML = `
                    <div class="flex flex-col items-center gap-4">
                        <div class="text-2xl font-bold text-red-400">Reprobado. ${aciertos}/5 aciertos (Mínimo 4).</div>
                        <button id="btn-reintento" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg hover:shadow-amber-500/30 transition-all text-lg transform hover:-translate-y-1">
                            Reintento en Caliente
                        </button>
                    </div>
                `;
            }
        }

        function reintentoEnCaliente() {
            const articles = document.querySelectorAll('.exercise-card');
            for (let i = 0; i < 5; i++) {
                const inputX = document.getElementById(`input-x-${i}`);
                const inputY = document.getElementById(`input-y-${i}`);
                
                inputX.value = '';
                inputY.value = '';
                inputX.disabled = false;
                inputY.disabled = false;
                
                articles[i].classList.remove('border-emerald-500', 'bg-emerald-900/20', 'border-red-500', 'bg-red-900/20');
                articles[i].classList.add('border-slate-700/50');
            }
            
            const actionsDiv = document.getElementById('actions-container');
            actionsDiv.innerHTML = `
                <button id="btn-evaluar" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-10 rounded-lg shadow-lg hover:shadow-emerald-500/30 transition-all text-lg transform hover:-translate-y-1">
                    Evaluar Respuestas
                </button>
            `;
        }
    </script>

    <!-- Módulo de Firebase v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWi_ko-0i-esAuNiO5EIQe-gThnQ1-iaM",
            authDomain: "calculointegral-2601b.firebaseapp.com",
            projectId: "calculointegral-2601b",
            storageBucket: "calculointegral-2601b.firebasestorage.app",
            messagingSenderId: "818910932073",
            appId: "1:818910932073:web:b7e2e4bbd4033d250386f8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                console.log("Sesión activa:", user.uid);
            } else {
                console.log("Modo local (sin sesión activa).");
            }
        });

        async function saveProgressToFirebase(score) {
            const actionsDiv = document.getElementById('actions-container');
            
            if (!currentUser) {
                actionsDiv.innerHTML += '<p class="text-amber-400 mt-2 font-semibold">Validado localmente (Inicia sesión para guardar).</p>';
                return;
            }
            
            try {
                // Ruta estandarizada para la plataforma
                const sessionRef = doc(db, "estudiantes", currentUser.uid, "progreso_sesiones", "sesion_sustitucion");
                await setDoc(sessionRef, {
                    tema: "Sistemas 2x2: Método de Sustitución",
                    aciertos: score,
                    umbralAprobatorio: 4,
                    resultado: "Aprobado",
                    ultimaPractica: serverTimestamp()
                }, { merge: true });
                
                actionsDiv.innerHTML += '<p class="text-emerald-400 mt-2 font-semibold">¡Progreso respaldado en Firebase exitosamente!</p>';
            } catch (error) {
                console.error("Error al contactar Firestore:", error);
                actionsDiv.innerHTML += '<p class="text-red-400 mt-2 font-semibold">Error de conexión al guardar el progreso.</p>';
            }
        }

        document.addEventListener('progresoAprobado', (e) => {
            saveProgressToFirebase(e.detail.score);
        });
    </script>
</body>
</html>
