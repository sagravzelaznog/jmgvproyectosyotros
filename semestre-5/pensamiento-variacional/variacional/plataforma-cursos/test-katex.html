<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <div id="math-target">
    <p>Las grúas torre soportan toneladas de acero gracias al equilibrio dinámico entre la <strong>fuerza de Tensión ($\vec{F}_T$)</strong> en los cables y la <strong>Gravedad/Peso ($\vec{F}_W$)</strong> jalando hacia abajo.</p>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      renderMathInElement(document.getElementById("math-target"), {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true },
        ],
        throwOnError: false,
        strict: false
      });
      console.log("HTML Rendered:", document.getElementById("math-target").innerHTML);
    });
  </script>
</body>
</html>
