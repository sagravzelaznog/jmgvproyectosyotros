<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Educativo de Cursos y Tutoriales</title>
    <!-- Fuente Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos del Portal -->
    <link rel="stylesheet" href="styles.css">

    <!-- Configuración Local Firebase -->
    <script src="env.js"></script>

    <!-- Firebase SDK (v8.10.1) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>
    <!-- Fondo Animado (Glassmorphism effect elements) -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="bg-shape shape3"></div>

    <div class="container">
        
        <!-- PANTALLA DE LOGIN -->
        <div id="login-screen" class="glass-panel active-screen">
            <div class="login-header">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1>Acceso a Cursos</h1>
                <p>Ingresa tus credenciales para continuar tu aprendizaje</p>
            </div>
            
            <form id="login-form">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Correo electrónico" required autocomplete="off">
                </div>
                
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
                
                <div id="error-message" class="error-msg hidden"></div>
                
                <div class="auth-buttons">
                    <button type="submit" class="btn-primary" id="btn-login">
                        Iniciar Sesión <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <button type="button" class="btn-secondary" id="btn-register">
                        Crear Cuenta Nueva
                    </button>
                </div>
            </form>
        </div>

        <!-- PANTALLA DE DASHBOARD (Catálogo de cursos) -->
        <div id="dashboard-screen" class="glass-panel hidden-screen">
            <header class="dashboard-header">
                <div class="welcome-text">
                    <h2>Bienvenido, <span id="user-email-display">Estudiante</span></h2>
                    <p>Selecciona un módulo o curso para comenzar a aprender</p>
                </div>
                <button id="logout-btn" class="btn-secondary logout">
                    <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
                </button>
            </header>
            
            <!-- Grid Dinámico de Cursos -->
            <div class="courses-grid" id="courses-container">
                <!-- Se inyecta con script.js -->
            </div>
        </div>

    </div>

    <!-- Script de Lógica Principal -->
    <script src="script.js"></script>
</body>
</html>
