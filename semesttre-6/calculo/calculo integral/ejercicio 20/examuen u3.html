<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen: Cálculo Integral</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML"></script>
    <script src="https://bernardo-castilho.github.io/DragDropTouch/DragDropTouch.js"></script>
     <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <style>
        :root {
            --primary: #46178f;
            --secondary: #1368ce;
            --success: #26890c;
            --danger: #e21b3c;
            --bg: #f4f4f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 5px;
        }

        p.instructions {
            text-align: center;
            font-size: 16px;
            margin-bottom: 30px;
            color: #666;
        }

        /* Banco de respuestas */
        #answers-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 20px;
            min-height: 80px;
            background: #e8eaf6;
            border: 2px dashed var(--primary);
            border-radius: 10px;
            margin-bottom: 30px;
            justify-content: center;
            align-items: center;
        }

        /* Elementos arrastrables */
        .draggable {
            background: white;
            border: 2px solid var(--secondary);
            color: var(--secondary);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: grab;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            user-select: none;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .draggable:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        /* Cuadrícula de ejercicios */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .exercise-card {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 18px;
        }

        .drop-zone {
            width: 140px;
            height: 50px;
            border: 2px dashed #999;
            border-radius: 8px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .drop-zone.hover {
            background: #e3f2fd;
            border-color: var(--secondary);
        }

        .drop-zone .draggable {
            margin: 0;
            border: none;
            box-shadow: none;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        /* Controles y resultados */
        .controls {
            text-align: center;
            margin-top: 20px;
        }

        .btn-eval {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-eval:hover {
            background: #311066;
        }

        #score-display {
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
            display: none;
        }

        /* Feedback visual */
        .correct { border-color: var(--success) !important; background: #e8f5e9 !important; }
        .incorrect { border-color: var(--danger) !important; background: #ffebee !important; }

        @media (max-width: 600px) {
            .exercise-card { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Evaluación: Integrales Inmediatas</h1>
        <p class="instructions">Arrastra la respuesta correcta del banco inferior y suéltala en el recuadro correspondiente para completar la fórmula. Cada término colocado vale 1 acierto (Total: 20).</p>
        
        <div id="answers-bank">
            </div>

        <div class="grid" id="exercises-grid">
            </div>

        <div class="controls">
            <button class="btn-eval" onclick="evaluateExam()">CALIFICAR EXAMEN</button>
            <div id="score-display"></div>
        </div>
    </div>

    <script>
        // Base de datos de 20 reactivos de Cálculo Integral
        const data = [
            { id: "q1",  q: "\\int x^n \\, dx", a: "\\frac{x^{n+1}}{n+1} + C" },
            { id: "q2",  q: "\\int dx", a: "x + C" },
            { id: "q3",  q: "\\int e^x \\, dx", a: "e^x + C" },
            { id: "q4",  q: "\\int \\frac{1}{x} \\, dx", a: "\\ln|x| + C" },
            { id: "q5",  q: "\\int \\sin(x) \\, dx", a: "-\\cos(x) + C" },
            { id: "q6",  q: "\\int \\cos(x) \\, dx", a: "\\sin(x) + C" },
            { id: "q7",  q: "\\int \\sec^2(x) \\, dx", a: "\\tan(x) + C" },
            { id: "q8",  q: "\\int \\csc^2(x) \\, dx", a: "-\\cot(x) + C" },
            { id: "q9",  q: "\\int \\sec(x)\\tan(x) \\, dx", a: "\\sec(x) + C" },
            { id: "q10", q: "\\int \\csc(x)\\cot(x) \\, dx", a: "-\\csc(x) + C" },
            { id: "q11", q: "\\int \\frac{dx}{1+x^2}", a: "\\arctan(x) + C" },
            { id: "q12", q: "\\int \\frac{dx}{\\sqrt{1-x^2}}", a: "\\arcsin(x) + C" },
            { id: "q13", q: "\\int a^x \\, dx", a: "\\frac{a^x}{\\ln(a)} + C" },
            { id: "q14", q: "\\int 0 \\, dx", a: "C" },
            { id: "q15", q: "\\int x \\, dx", a: "\\frac{x^2}{2} + C" },
            { id: "q16", q: "\\int \\sqrt{x} \\, dx", a: "\\frac{2}{3}x^{3/2} + C" },
            { id: "q17", q: "\\int \\frac{1}{x^2} \\, dx", a: "-\\frac{1}{x} + C" },
            { id: "q18", q: "\\int e^{-x} \\, dx", a: "-e^{-x} + C" },
            { id: "q19", q: "\\int \\tan(x) \\, dx", a: "-\\ln|\\cos(x)| + C" },
            { id: "q20", q: "\\int \\cot(x) \\, dx", a: "\\ln|\\sin(x)| + C" }
        ];

        // Función para desordenar un arreglo
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Inicializar la interfaz
        function initExam() {
            const bank = document.getElementById('answers-bank');
            const grid = document.getElementById('exercises-grid');
            
            // Crear una copia desordenada para las respuestas
            const shuffledAnswers = shuffle([...data]);

            // Generar las tarjetas de ejercicios
            data.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                card.innerHTML = `
                    <div class="question">\\( ${item.q} = \\)</div>
                    <div class="drop-zone" data-correct="${item.id}"></div>
                `;
                grid.appendChild(card);
            });

            // Generar las opciones arrastrables
            shuffledAnswers.forEach((item) => {
                const dragItem = document.createElement('div');
                dragItem.className = 'draggable';
                dragItem.draggable = true;
                dragItem.id = `drag-${item.id}`;
                dragItem.dataset.id = item.id;
                dragItem.innerHTML = `\\( ${item.a} \\)`;
                bank.appendChild(dragItem);
            });

            // Renderizar las ecuaciones con MathJax antes de asignar eventos
            MathJax.Hub.Queue(["Typeset", MathJax.Hub, document.body], setupDragAndDrop);
        }

        // Configurar la lógica de Drag and Drop
        function setupDragAndDrop() {
            const draggables = document.querySelectorAll('.draggable');
            const dropZones = document.querySelectorAll('.drop-zone, #answers-bank');

            draggables.forEach(draggable => {
                draggable.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', draggable.id);
                    setTimeout(() => draggable.style.opacity = '0.5', 0);
                });

                draggable.addEventListener('dragend', () => {
                    draggable.style.opacity = '1';
                });
            });

            dropZones.forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if(zone.classList.contains('drop-zone')) {
                        zone.classList.add('hover');
                    }
                });

                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('hover');
                });

                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('hover');
                    
                    const draggedId = e.dataTransfer.getData('text/plain');
                    const draggedElement = document.getElementById(draggedId);
                    
                    if (!draggedElement) return;

                    // Si se suelta en una zona de caída (ejercicio)
                    if (zone.classList.contains('drop-zone')) {
                        // Si la zona ya tiene una respuesta, regresarla al banco
                        if (zone.children.length > 0) {
                            document.getElementById('answers-bank').appendChild(zone.children[0]);
                        }
                        zone.appendChild(draggedElement);
                    } 
                    // Si se regresa al banco de respuestas
                    else if (zone.id === 'answers-bank') {
                        zone.appendChild(draggedElement);
                    }
                });
            });
        }

        // Evaluar las respuestas
        function evaluateExam() {
            const dropZones = document.querySelectorAll('.drop-zone');
            let score = 0;

            dropZones.forEach(zone => {
                // Limpiar estilos previos
                zone.classList.remove('correct', 'incorrect');
                
                const correctId = zone.dataset.correct;
                const droppedItem = zone.children[0];

                if (droppedItem) {
                    const droppedId = droppedItem.dataset.id;
                    if (correctId === droppedId) {
                        zone.classList.add('correct');
                        score++;
                    } else {
                        zone.classList.add('incorrect');
                    }
                } else {
                    zone.classList.add('incorrect');
                }
            });

            // Deshabilitar el arrastre después de calificar
            document.querySelectorAll('.draggable').forEach(d => d.draggable = false);

            const display = document.getElementById('score-display');
            display.style.display = 'block';
            display.innerHTML = `Tu calificación final es: <span style="color: ${score >= 14 ? 'var(--success)' : 'var(--danger)'}">${score} / 20</span> aciertos.`;
            
            // Scroll suave hacia la calificación
            display.scrollIntoView({ behavior: 'smooth' });
        }

        // Iniciar al cargar la página
        window.onload = initExam;
    </script>
</body>
</html>
