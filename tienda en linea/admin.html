<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Subir Productos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse para procesar el Excel/CSV en el frontend -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen flex items-center justify-center">

  <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-2xl border border-gray-700">
    <div class="flex items-center gap-3 mb-6 border-b border-gray-700 pb-4">
      <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
      <h1 class="text-2xl font-bold">Importador de Catálogo (Excel/CSV)</h1>
    </div>

    <div class="mb-6">
      <p class="text-gray-400 mb-4 text-sm">Sube tu archivo <span class="text-white font-bold">.csv</span> guardado desde Excel. Asegúrate de respetar las columnas de la plantilla original.</p>
      
      <label class="block w-full flex justify-center px-4 py-6 border-2 border-gray-600 border-dashed rounded-md cursor-pointer hover:border-emerald-500 hover:bg-gray-700 transition-colors">
        <span class="flex items-center space-x-2">
          <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
          <span class="font-medium text-gray-300">Seleccionar archivo Excel/CSV</span>
        </span>
        <input type="file" id="csv-file" accept=".csv" class="hidden">
      </label>
      <p id="file-name" class="text-emerald-400 text-sm mt-2 text-center font-bold hidden"></p>
    </div>

    <div id="preview-section" class="hidden mb-6">
      <h3 class="text-sm font-bold text-gray-300 mb-2">Vista Previa (<span id="total-rows">0</span> productos encontrados):</h3>
      <div class="bg-gray-900 rounded p-4 max-h-40 overflow-y-auto text-xs font-mono text-gray-400 border border-gray-700" id="preview-data">
      </div>
    </div>

    <button id="upload-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded transition-colors disabled:opacity-50 disabled:cursor-not-allowed hidden" disabled>
      Subir al Servidor Seguro
    </button>
  </div>

  <script type="module">
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";
    import { app } from "./admin-setup.js";
    
    const functions = getFunctions(app);
    let parsedData = [];

    const fileInput = document.getElementById('csv-file');
    const fileNameDisplay = document.getElementById('file-name');
    const previewSection = document.getElementById('preview-section');
    const previewData = document.getElementById('preview-data');
    const totalRows = document.getElementById('total-rows');
    const uploadBtn = document.getElementById('upload-btn');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileNameDisplay.textContent = `Archivo cargado: ${file.name}`;
      fileNameDisplay.classList.remove('hidden');

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          parsedData = results.data;
          
          if(parsedData.length > 0) {
            totalRows.textContent = parsedData.length;
            previewData.textContent = JSON.stringify(parsedData.slice(0, 2), null, 2) + "\n... y más.";
            previewSection.classList.remove('hidden');
            uploadBtn.classList.remove('hidden');
            uploadBtn.disabled = false;
          }
        },
        error: function(err) {
          alert("Error al leer el archivo: " + err.message);
        }
      });
    });

    uploadBtn.addEventListener('click', async () => {
      try {
        uploadBtn.disabled = true;
        uploadBtn.textContent = 'Enviando a Firebase...';

        // Convertir strings a números según el modelo de datos
        const formattedData = parsedData.map(item => ({
          name: item.nombre,
          description: item.descripcion,
          price: parseInt(item.precio, 10), // en centavos
          stock: parseInt(item.stock, 10),
          category: item.categoria,
          images: [item.imagenUrl],
          isActive: true
        }));

        const bulkUpload = httpsCallable(functions, 'bulkUploadProducts');
        const result = await bulkUpload({ products: formattedData });

        alert(`¡Éxito! ${result.data.count} productos fueron insertados/actualizados.`);
        window.location.href = "index.html"; // Redirigir a la tienda

      } catch (error) {
        console.error(error);
        alert("Error al subir los productos: " + error.message);
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Subir al Servidor Seguro';
      }
    });
  </script>
</body>
</html>
