<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureStore | Centro de Comando</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        #authOverlay { backdrop-filter: blur(20px); }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col md:flex-row relative">

    <div id="authOverlay" class="absolute inset-0 z-50 bg-slate-900 flex flex-col items-center justify-center text-white transition-opacity duration-500">
        <i class="fas fa-shield-alt text-6xl text-blue-500 mb-4"></i>
        <h2 class="text-2xl font-bold tracking-widest uppercase mb-4">Acceso Administrativo</h2>
        <button id="googleLoginBtn" class="bg-white text-slate-800 font-bold py-3 px-6 rounded-full shadow-lg hover:bg-slate-100 transition-all flex items-center mb-2">
            <i class="fab fa-google text-red-500 mr-3 text-xl"></i>
            Iniciar sesión con Google
        </button>
        <p id="authErrorMsg" class="text-rose-400 mt-2 text-sm hidden font-semibold">Acceso denegado: No tienes permisos de administrador.</p>
        <p class="text-slate-500 mt-4 text-xs">Acceso restringido a nivel administrativo</p>
    </div>

    <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col min-h-screen shadow-2xl z-10">
        <div class="p-6 border-b border-slate-700/50">
            <h1 class="text-2xl font-bold text-blue-500"><i class="fas fa-satellite-dish mr-2 text-emerald-400"></i>Secure<span class="text-white">Admin</span></h1>
        </div>
        <nav class="flex-grow p-4 space-y-2">
            <a href="#" class="block px-4 py-3 bg-blue-600 rounded-lg font-semibold flex items-center shadow-lg shadow-blue-500/30">
                <i class="fas fa-plus-circle w-6"></i> Nuevo Producto
            </a>
            <a href="#" class="block px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors flex items-center">
                <i class="fas fa-boxes w-6"></i> Inventario
            </a>
            <a href="#" class="block px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors flex items-center">
                <i class="fas fa-receipt w-6"></i> Auditoría Pedidos
            </a>
        </nav>
        <div class="p-4 border-t border-slate-700/50">
            <button id="logoutBtn" class="w-full px-4 py-2 text-rose-400 hover:text-white hover:bg-rose-500/20 rounded-lg transition-colors flex items-center justify-center">
                <i class="fas fa-sign-out-alt mr-2"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <main class="flex-grow p-8">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h2 class="text-3xl font-bold text-slate-800">Alta de Catálogo</h2>
                <p class="text-slate-500 mt-1">Sincronización directa con Firestore y Firebase Storage</p>
            </div>
            <div id="adminBadge" class="hidden items-center bg-emerald-100 text-emerald-700 px-4 py-2 rounded-full font-bold text-sm shadow-sm">
                <i class="fas fa-check-circle mr-2"></i> Identidad Verificada
            </div>
        </header>

        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 max-w-4xl">
            <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div class="col-span-full md:col-span-1">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Nombre del Producto</label>
                    <input type="text" id="pNombre" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>

                <div class="col-span-full md:col-span-1 grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Precio Fijo (USD)</label>
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-slate-400 font-bold">$</span>
                            <input type="number" id="pPrecio" step="0.01" min="0" required class="w-full pl-8 pr-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Stock Inicial</label>
                        <input type="number" id="pStock" min="1" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div class="col-span-full">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Descripción Detallada</label>
                    <textarea id="pDesc" rows="3" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                </div>

                <div class="col-span-full">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Fotografía (Archivo Seguro)</label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-slate-300 border-dashed rounded-lg bg-slate-50 hover:bg-slate-100 transition-colors">
                        <div class="space-y-1 text-center">
                            <i class="fas fa-cloud-upload-alt text-4xl text-slate-400 mb-3"></i>
                            <div class="flex text-sm text-slate-600 justify-center">
                                <label for="pImage" class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-blue-500">
                                    <span>Selecciona un archivo</span>
                                    <input id="pImage" name="pImage" type="file" accept="image/png, image/jpeg" required class="sr-only">
                                </label>
                            </div>
                            <p class="text-xs text-slate-500">PNG o JPG hasta 2MB</p>
                        </div>
                    </div>
                </div>

                <div class="col-span-full pt-4 border-t border-slate-100 mt-2">
                    <button type="submit" id="submitBtn" class="w-full bg-slate-900 hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all duration-300 flex justify-center items-center group">
                        <i class="fas fa-database mr-2 group-hover:animate-bounce"></i> Inyectar a Firestore
                    </button>
                </div>
                
                <div id="statusBox" class="col-span-full hidden p-4 rounded-lg font-medium text-center"></div>
            </form>
        </div>
    </main>

    <script type="module" src="./admin-setup.js"></script>
</body>
</html>
