mutation CreateUser($email: String!, $name: String, $phoneNumber: String) @auth(level: USER) {
  user_insert(data: {
    id_expr: "auth.uid",
    email: $email,
    role: "customer",
    name: $name,
    phoneNumber: $phoneNumber
  })
}

mutation UpdateProfile($name: String, $phoneNumber: String) @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {name: $name, phoneNumber: $phoneNumber})
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetMyProfile @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    email name phoneNumber role
  }
}

query ListUsers @auth(expr: "auth.token.admin == true") {
  users {
    email name phoneNumber
  }
}

mutation CreateProduct($name: String!, $price: Float!, $thickness: Float!, $description: String, $imageUrl: String, $category: String) @auth(expr: "auth.token.admin == true") {
  product_insert(data: {
    name: $name,
    price: $price,
    baseMaterialThickness: $thickness,
    description: $description,
    imageUrl: $imageUrl,
    category: $category
  })
}

mutation UpdateProduct($id: UUID!, $price: Float) @auth(expr: "auth.token.admin == true") {
  product_update(id: $id, data: {price: $price})
}

mutation DeleteProduct($id: UUID!) @auth(expr: "auth.token.admin == true") {
  product_delete(id: $id)
}

query GetProduct($id: UUID!) @auth(level: PUBLIC, insecureReason: "Product catalog is public.") {
  product(id: $id) {
    name price description imageUrl
  }
}

query ListProducts @auth(level: PUBLIC, insecureReason: "Product catalog is public.") {
  products {
    id name price category
  }
}

mutation CreateOrder($totalAmount: Float!) @auth(level: USER) {
  order: order_insert(data: {
    userId_expr: "auth.uid",
    status: "pending",
    totalAmount: $totalAmount,
    createdAt_expr: "request.time"
  })
}

mutation UpdateOrderStatus($id: UUID!, $status: String!) @auth(expr: "auth.token.admin == true") {
  order_update(id: $id, data: {status: $status})
}

mutation DeleteOrder($id: UUID!) @auth(level: USER) {
  order_delete(id: $id)
}

query GetMyOrders @auth(level: USER) {
  orders(where: {userId: {eq_expr: "auth.uid"}}) {
    id status totalAmount createdAt
  }
}

mutation CreateOrderItem($orderId: UUID!, $productId: UUID!, $quantity: Int!, $price: Float!) @auth(level: USER) {
  orderItem_insert(data: {
    orderId: $orderId,
    productId: $productId,
    quantity: $quantity,
    priceAtPurchase: $price
  })
}

mutation DeleteOrderItem($id: UUID!) @auth(level: USER) {
  orderItem_delete(id: $id)
}

query GetOrderItems($orderId: UUID!) @auth(level: USER) {
  orderItems(where: {orderId: {eq: $orderId}}) {
    product { name }
    quantity priceAtPurchase
  }
}

mutation CreateReview($productId: UUID!, $rating: Int!, $comment: String) @auth(level: USER) {
  review_insert(data: {
    userId_expr: "auth.uid",
    productId: $productId,
    rating: $rating,
    comment: $comment
  })
}

mutation DeleteReview($id: UUID!) @auth(level: USER) {
  review_delete(id: $id)
}

query ListProductReviews($productId: UUID!) @auth(level: PUBLIC, insecureReason: "Reviews are public testimonials.") {
  reviews(where: {productId: {eq: $productId}}) {
    rating comment user { name }
  }
}