<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda E-commerce Segura</title>
  <!-- Importamos Tailwind CSS via CDN para el diseño estético -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
  
  <!-- Navbar de la Tienda -->
  <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        <h1 class="text-2xl font-black tracking-tight text-gray-900">Secure<span class="text-indigo-600">Shop</span></h1>
      </div>
      
      <!-- Botón para ver el Carrito en Móviles/Desktop -->
      <button id="cart-toggle" class="relative p-2 text-gray-600 hover:text-indigo-600 transition bg-gray-50 rounded-full hover:bg-indigo-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center shadow-sm">0</span>
      </button>
    </div>
  </header>

  <!-- Estructura Principal -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col lg:flex-row gap-8">
    
    <!-- Sección de Catálogo de Productos -->
    <section class="flex-1">
      <div class="mb-6 border-b pb-4">
        <h2 class="text-2xl font-bold text-gray-900">Nuevos Ingresos</h2>
        <p class="text-gray-500">Explora nuestro catálogo en tiempo real.</p>
      </div>
      
      <!-- Grid de Productos (Inyectado por JS) -->
      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
        <!-- Renderizado dinámico -->
      </div>
    </section>

    <!-- Sidebar del Carrito de Compras -->
    <aside id="cart-sidebar" class="w-full lg:w-[400px] bg-white p-6 rounded-2xl shadow-xl border border-gray-100 hidden lg:block sticky top-24 h-fit">
      <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
        <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
        Resumen de Compra
      </h2>
      
      <!-- Contenedor de Items -->
      <div id="cart-items" class="flex flex-col gap-4 mb-6 min-h-[150px] max-h-[350px] overflow-y-auto pr-2 scrollbar-thin scrollbar-thumb-gray-200">
        <!-- Items Inyectados por JS -->
      </div>
      
      <!-- Totales Dinámicos -->
      <div class="border-t border-gray-100 pt-4 bg-gray-50 p-4 rounded-lg">
        <div class="flex justify-between mb-2 text-sm">
          <span class="text-gray-600">Subtotal:</span>
          <span id="cart-subtotal" class="font-medium text-gray-900">$0.00</span>
        </div>
        <div class="flex justify-between mb-2 text-sm">
          <span class="text-gray-600">Impuestos (16%):</span>
          <span id="cart-tax" class="font-medium text-gray-900">$0.00</span>
        </div>
        <div class="flex justify-between font-bold text-lg mt-4 pt-4 border-t border-gray-200">
          <span class="text-gray-900">Total:</span>
          <span id="cart-total" class="text-indigo-600">$0.00</span>
        </div>
      </div>
      
      <!-- Botón de Pago (Inicia Estado 3) -->
      <button id="checkout-btn" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed transform hover:-translate-y-0.5 active:translate-y-0" disabled>
        Checkout Seguro SSL
      </button>
      <div class="mt-4 flex justify-center gap-2 items-center text-xs text-gray-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        Pagos encriptados de extremo a extremo
      </div>
    </aside>

  </main>

  <!-- Script principal que agrupa la lógica (type=module es crucial para usar imports) -->
  <script type="module" src="store-app.js"></script>
</body>
</html>
